name: Build ImageTagger

on:
  push:
    branches: [ "build" ]

# Explicitly grant permissions to create releases
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ImageTagger/ImageTagger.csproj

    - name: Build and Publish
      run: |
        dotnet publish ImageTagger/ImageTagger.csproj `
          --configuration Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishReadyToRun=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:Version=1.0.${{ github.run_number }} `
          --output ./publish

    - name: List files in publish directory
      run: ls ./publish

    - name: Create GitHub Release
      # This step will create a formal release on the repository's home page
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: ImageTagger v1.0.${{ github.run_number }}
        files: ./publish/ImageTagger.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageTagger-v1.0.${{ github.run_number }}
        path: ./publish/