name: Build ImageTagger

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ImageTagger/ImageTagger.csproj

    - name: Build
      run: dotnet build ImageTagger/ImageTagger.csproj --configuration Release --no-restore

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageTagger-Release
        path: ImageTagger/bin/Release/net8.0-windows/
